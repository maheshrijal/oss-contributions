name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */8 * * *" # every 8 hours, to pick up new merged PRs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/build.mjs
      # Upload and release new content only. Routes and the custom domain are
      # left alone, so the token only needs Editor on this one Worker.
      # To change them, edit wrangler.jsonc and run `wrangler deploy` locally.
      - name: Deploy
        run: |
          out=$(npx --yes wrangler@4.157.0 versions upload)
          echo "$out"
          id=$(echo "$out" | sed -n 's/^Worker Version ID: //p')
          test -n "$id"
          npx --yes wrangler@4.157.0 versions deploy "$id@100%" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
